name: CI

on:
  push:
    branches: [feat/soko-upgrade, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate catalog
        run: npm run validate

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
